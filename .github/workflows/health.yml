# GUJI 定时健康检查（v4.0.2.1，ROADMAP D3）
#
# 每天 UTC 22:30（北京 06:30，早班推送后半小时）：
#   1. 全量跑 smoke + e2e 测试（代码与 fixture 契约回归——线上日报红之前，
#      这里先红：fixture 锁已知源格式，测试锁精选/校验/聚类逻辑）
#   2. 探 /api/diag（HTTP 200 + digestErr 为空 = 上一班精选链路健康）
#   3. 任一失败 → 开（或跟进）一个带 health 标签的 issue，失败绝不静默
#
# 前置配置：repo secret DIAG_KEY 与 worker 侧 env.DIAG_KEY 同值。
# C5 灰度语义（v4.0.2.1）：worker 侧未配置 DIAG_KEY 时端点放行——
#   - 两边都未配置：diag 返回 200，本检查通过（但等于没校验身份）
#   - worker 配了而本 repo secret 漏配：curl 带空 key → 403 → 本检查失败并开
#     issue 提醒（这正是配置漂移告警的触发路径）
#   - 两边同值：200 且身份校验真正生效
# 手动触发：Actions 页 → Health check → Run workflow。

name: Health check

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: 测试回归（smoke + e2e）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖（src/ 有 package-lock.json）
        working-directory: src
        run: npm ci
      - name: smoke 契约测试（fixture + 纯函数）
        working-directory: src
        run: node smoke-v4.mjs
      - name: e2e 全链路测试（队列 mock）
        working-directory: src
        run: node e2e-v4.mjs

  diag:
    name: 线上 diag 探测
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/diag
        id: diag
        env:
          DIAG_KEY: ${{ secrets.DIAG_KEY }}
        run: |
          code=$(curl -sS -o /tmp/diag.json -w '%{http_code}' -G --data-urlencode "key=$DIAG_KEY" "https://guji.dpdns.org/api/diag")
          echo "HTTP $code"
          head -c 400 /tmp/diag.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::diag HTTP $code（DIAG_KEY secret 未设置或与 worker 侧不一致？）"
            exit 1
          fi
          # digestErr 非 null/非空 = 上一班精选失败（推送走了英文兜底），要有人看
          python3 - <<'EOF'
          import json, sys
          d = json.load(open('/tmp/diag.json'))
          err = d.get('digestErr')
          if err:
              print(f"::error::上一班 digestErr 非空：{str(err)[:200]}")
              sys.exit(1)
          print(f"diag OK: window={d.get('window')} items={d.get('items')} digest={d.get('digest')}")
          EOF
      - name: 失败时开/跟进 issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'health', per_page: 1,
            });
            const body = `健康检查失败于 ${new Date().toISOString()}\n`
              + `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n`
              + `触发方式: ${context.eventName}`;
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '⚠️ GUJI 健康检查失败', body, labels: ['health'],
              });
            }
